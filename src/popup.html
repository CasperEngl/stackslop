<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stackslop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <p id="status" class="status">Loading…</p>
    <ol id="preview" class="stack" hidden></ol>
    <footer id="actions" class="actions" hidden>
      <button id="copy-pr" class="button" type="button"><span>Copy PR</span> <kbd>P</kbd></button>
      <button id="copy-stack" class="button" type="button" hidden><span>Copy stack</span> <kbd>S</kbd></button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
