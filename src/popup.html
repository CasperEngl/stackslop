<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Link Copier</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <p id="status" class="status">Loading pull request…</p>
    <ul id="preview" class="preview" hidden></ul>
    <div id="actions" class="actions" hidden>
      <button id="copy-pr" type="button">Copy PR <kbd>↵</kbd></button>
      <button id="copy-stack" type="button" hidden>Copy stack <kbd>S</kbd></button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
